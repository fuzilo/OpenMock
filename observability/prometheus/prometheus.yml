global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: socialguard
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8084"]
        labels:
          application: SocialGuard
  - job_name: OpenMock
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]
        labels:
          application: OpenMock