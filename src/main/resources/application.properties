spring.application.name=OpenMock
server.port=8082
spring.datasource.url=jdbc:mysql://localhost:3306/social_guard?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=aluno
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:aluno}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:aluno}

# --- Processamento de lotes ---
openmock.socialguard.base-url=${SOCIALGUARD_BASE_URL:http://localhost:8084}
openmock.socialguard.connect-timeout=${SOCIALGUARD_CONNECT_TIMEOUT:2s}
openmock.socialguard.read-timeout=${SOCIALGUARD_READ_TIMEOUT:10s}
openmock.batch.exchange=${BATCH_EXCHANGE:socialguard.batch}
openmock.batch.queue=${BATCH_QUEUE:socialguard.batch.processing}
openmock.batch.routing-key=${BATCH_ROUTING_KEY:batch.process}
openmock.batch.dlx=${BATCH_DLX:socialguard.batch.dlx}
openmock.batch.dlq=${BATCH_DLQ:socialguard.batch.failed}
openmock.batch.dlx-routing-key=${BATCH_DLX_ROUTING_KEY:batch.failed}
openmock.batch.retry.max-attempts=${BATCH_MAX_ATTEMPTS:3}
openmock.batch.retry.initial-interval=${BATCH_RETRY_INITIAL_INTERVAL:1s}
openmock.batch.retry.multiplier=${BATCH_RETRY_MULTIPLIER:2.0}
openmock.batch.retry.max-interval=${BATCH_RETRY_MAX_INTERVAL:5s}
openmock.batch.inference.minimum-tokens=${INFERENCE_MINIMUM_TOKENS:100}
openmock.batch.inference.maximum-tokens=${INFERENCE_MAXIMUM_TOKENS:500}
openmock.batch.inference.models=${INFERENCE_MODELS:gpt-4,gpt-3.5-turbo}

# --- Observabilidade ---
# Endpoints do Actuator (Prometheus coleta /actuator/prometheus)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
# Histograma para calcular percentis (p95/p99) de lat�ncia no Grafana
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Traces enviados via OTLP para o Grafana Tempo (docker-compose)
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces